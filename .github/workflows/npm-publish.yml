name: Release to npm

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org/"

      - name: Remove node_modules before commit
        run: rm -rf node_modules

      - name: Install dependencies
        run: npm ci # or npm install

      - name: Create version bump if needed
        run: npx changeset version

      - name: Commit & push version bump
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- node_modules
          git commit -m "chore: version bump [skip ci]" || echo "No changes to commit"
          git push

      - name: Build package
        run: npm run build

      - name: Publish to npm
        # bash with pipefail, so a failed publish is not hidden by tee
        shell: bash
        run: npx changeset publish | tee publish.log
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Tag and release only what was just published, on the commit that was published.
      # Tags created with GITHUB_TOKEN do not start other workflows.
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! grep -q "packages published successfully" publish.log; then
            echo "Nothing was published; no release to create."
            exit 0
          fi
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          PREVIOUS=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n 1)
          awk -v heading="## $VERSION" '$0 == heading { found = 1; next } /^## / { if (found) exit } found' CHANGELOG.md > release-notes.md
          if [ -n "$PREVIOUS" ]; then
            printf '\n**Full Changelog**: %s/%s/compare/%s...%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$PREVIOUS" "$TAG" >> release-notes.md
          fi
          gh release create "$TAG" --target "$(git rev-parse HEAD)" --title "$TAG" --notes-file release-notes.md --latest
