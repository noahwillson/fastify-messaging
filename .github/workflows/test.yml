name: Test

on:
  pull_request:
  # Also run by the release workflow before it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    services:
      rabbitmq:
        image: rabbitmq:4.1
        env:
          # guest may only connect from localhost inside the container
          RABBITMQ_DEFAULT_USER: test
          RABBITMQ_DEFAULT_PASS: test
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # main is protected, so the release job cannot push a version bump:
      # changesets must be turned into a version bump in the pull request itself.
      - name: Check changesets are versioned
        run: |
          pending=$(find .changeset -name '*.md' ! -name README.md)
          if [ -n "$pending" ]; then
            echo "::error::Unreleased changesets: $pending. Run 'npx changeset version' and commit the result in this pull request."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
        env:
          AMQP_URL: amqp://test:test@localhost:5672
